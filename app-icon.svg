<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tile: deep space, a little lighter behind the globe -->
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a5e"/>
      <stop offset="1" stop-color="#060a1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3d7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3d7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <!-- Globe: ocean lit from the upper left -->
    <radialGradient id="ocean" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="0.35" stop-color="#2a8cf0"/>
      <stop offset="0.75" stop-color="#1243a8"/>
      <stop offset="1" stop-color="#0a1f5c"/>
    </radialGradient>
    <linearGradient id="night" x1="0.25" y1="0.2" x2="0.95" y2="0.9">
      <stop offset="0.45" stop-color="#020617" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="27%" r="30%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0a1"/>
      <stop offset="1" stop-color="#1f9d6b"/>
    </linearGradient>
    <clipPath id="sphere"><circle cx="512" cy="512" r="290"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <!-- Orbit ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff8f3d"/>
    </linearGradient>
    <radialGradient id="sat" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffcf5c" stop-opacity="0"/>
    </radialGradient>
    <!-- In the ring's tilted frame: the far half is above the centre line, the near half below -->
    <clipPath id="far"><rect x="0" y="0" width="1024" height="512"/></clipPath>
    <clipPath id="near"><rect x="0" y="512" width="1024" height="512"/></clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#space)"/>
  </g>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="512" r="420" fill="url(#halo)"/>
    <g fill="#fff">
      <circle cx="226" cy="236" r="3.5" opacity="0.8"/>
      <circle cx="808" cy="214" r="2.5" opacity="0.6"/>
      <circle cx="292" cy="812" r="2.5" opacity="0.5"/>
      <circle cx="770" cy="836" r="3" opacity="0.7"/>
      <circle cx="176" cy="560" r="2" opacity="0.5"/>
      <circle cx="866" cy="470" r="2" opacity="0.55"/>
      <circle cx="640" cy="160" r="2" opacity="0.5"/>
    </g>

    <!-- Far half of the orbit, behind the globe -->
    <g transform="rotate(-22 512 512)">
      <ellipse cx="512" cy="512" rx="392" ry="112" fill="none" stroke="url(#ring)" stroke-width="20" opacity="0.5" clip-path="url(#far)"/>
    </g>

    <!-- Atmosphere -->
    <circle cx="512" cy="512" r="300" fill="#58c6ff" opacity="0.55" filter="url(#glow)"/>

    <!-- Globe -->
    <circle cx="512" cy="512" r="290" fill="url(#ocean)"/>
    <g clip-path="url(#sphere)">
      <!-- Stylised land, kept soft so it reads at small sizes -->
      <path d="M282 338C291 331 303 316 318 308C333 300 353 296 372 292C391 288 415 285 430 286C445 287 455 293 462 300C469 307 466 325 470 328C474 331 483 323 488 318C493 313 493 300 500 298C507 296 523 301 532 306C541 311 553 322 556 330C559 338 556 348 552 356C548 364 535 370 530 378C525 386 525 395 522 404C519 413 512 420 512 430C512 440 521 454 520 462C519 470 512 478 506 478C500 478 492 464 484 462C476 460 465 464 458 468C451 472 441 479 440 488C439 497 447 512 452 522C457 532 465 541 472 548C479 555 484 562 492 566C500 570 508 572 518 574C528 576 539 575 552 580C565 585 582 594 594 604C606 614 620 627 624 640C628 653 623 670 616 682C609 694 594 701 584 712C574 723 564 736 556 750C548 764 541 790 534 798C527 806 520 807 516 800C512 793 511 773 508 756C505 739 501 718 496 700C491 682 484 665 480 650C476 635 470 620 470 610C470 600 479 595 478 590C477 585 469 584 462 578C455 572 445 562 436 552C427 542 416 531 408 520C400 509 395 497 388 486C381 475 373 463 366 452C359 441 351 428 344 418C337 408 333 398 326 390C319 382 309 376 300 372C291 368 276 371 270 368C264 365 260 357 262 352C264 347 273 345 282 338Z" fill="url(#land)"/>
      <path d="M560 258C567 253 588 248 600 250C612 252 628 260 632 268C636 276 629 288 622 296C615 304 601 316 592 318C583 320 574 312 568 306C562 300 557 290 556 282C555 274 553 263 560 258Z" fill="url(#land)" opacity="0.85"/>
      <!-- Lines of latitude and longitude -->
      <g fill="none" stroke="#e6f6ff" stroke-opacity="0.28" stroke-width="4">
        <ellipse cx="512" cy="512" rx="96" ry="290"/>
        <ellipse cx="512" cy="512" rx="205" ry="290"/>
        <ellipse cx="512" cy="512" rx="275" ry="290"/>
        <line x1="512" y1="222" x2="512" y2="802"/>
        <line x1="222" y1="512" x2="802" y2="512"/>
        <line x1="261" y1="367" x2="763" y2="367"/>
        <line x1="261" y1="657" x2="763" y2="657"/>
      </g>
      <circle cx="512" cy="512" r="290" fill="url(#night)"/>
      <circle cx="512" cy="512" r="290" fill="url(#shine)"/>
    </g>
    <circle cx="512" cy="512" r="289" fill="none" stroke="#bfeaff" stroke-opacity="0.5" stroke-width="3"/>

    <!-- Near half of the orbit, in front, with a satellite on it -->
    <g transform="rotate(-22 512 512)">
      <ellipse cx="512" cy="512" rx="392" ry="112" fill="none" stroke="url(#ring)" stroke-width="20" clip-path="url(#near)"/>
      <circle cx="646" cy="617" r="46" fill="url(#sat)"/>
      <circle cx="646" cy="617" r="15" fill="#fff"/>
    </g>
  </g>
</svg>
